name: Kite Connect Mock API Tests

on:
  push:
    branches: [main]
    paths:
      - "01-qa-api-testing/kite-connect-api/mock-api-tests/**"
      - ".github/workflows/kite-mock-api-tests.yml"
  pull_request:
    paths:
      - "01-qa-api-testing/kite-connect-api/mock-api-tests/**"
      - ".github/workflows/kite-mock-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Offline pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: 01-qa-api-testing/kite-connect-api/mock-api-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 01-qa-api-testing/kite-connect-api/mock-api-tests/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run mocked authentication tests
        run: python -m pytest -v --junitxml=pytest-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kite-mock-pytest-python-${{ matrix.python-version }}
          path: 01-qa-api-testing/kite-connect-api/mock-api-tests/pytest-results.xml
          if-no-files-found: warn
